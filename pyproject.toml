[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-utility-toolbox"
version = "0.1.0"
description = "Modular, high-performance headless image processing engine and utility suite."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hakan Kayacı"}
]
dependencies = [
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "piexif>=1.1.3",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
image-box = "image_toolbox.cli.main:app"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = ["src"]
