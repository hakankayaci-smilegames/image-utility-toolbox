name: Release - Multi-Platform Desktop & Mobile

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-linux:
    name: Build Desktop (Linux AppImage & tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            wget file

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name ImageToolbox \
            --icon assets/icon.png \
            --paths src \
            --collect-all image_toolbox \
            launcher.py

      - name: Create Portable Tarball
        run: |
          cd dist
          tar -czf ../ImageToolbox-Linux-x86_64.tar.gz ImageToolbox

      - name: Build Standalone AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/ImageToolbox/* AppDir/usr/bin/
          cp assets/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun
          cp assets/image-toolbox.desktop AppDir/image-toolbox.desktop
          cp assets/icon.png AppDir/image-toolbox.png
          cp assets/icon.png AppDir/.DirIcon
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/image-toolbox.png
          
          # Download appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir ImageToolbox-Linux-x86_64.AppImage

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            ImageToolbox-Linux-x86_64.AppImage
            ImageToolbox-Linux-x86_64.tar.gz

  build-desktop-windows:
    name: Build Desktop (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name ImageToolbox `
            --icon assets/icon.ico `
            --paths src `
            --collect-all image_toolbox `
            launcher.py

      - name: Create Windows Zip Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ImageToolbox -DestinationPath ImageToolbox-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ImageToolbox-Windows-x64.zip

  build-desktop-macos:
    name: Build Desktop (macOS App Bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build macOS App Bundle with PyInstaller
        run: |
          pyinstaller --noconfirm --windowed \
            --name ImageToolbox \
            --icon assets/icon.png \
            --paths src \
            --collect-all image_toolbox \
            launcher.py

      - name: Create macOS Zip Package
        run: |
          cd dist
          zip -r -y ../ImageToolbox-macOS.zip ImageToolbox.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: ImageToolbox-macOS.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ImageUtilityToolbox-debug.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: ImageUtilityToolbox-debug.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-desktop-linux, build-desktop-windows, build-desktop-macos, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
